apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-git-write
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(image-automation): update ratlab-demo image

        {{ range .Changed.Changes }}{{ . }}
        {{ end }}
    push:
      branch: main
  update:
    path: ./
    strategy: Settle
