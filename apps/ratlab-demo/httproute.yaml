apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ratlab-demo
  namespace: ratlab-demo
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - "ratlab-demo.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ratlab-demo
          namespace: ratlab-demo
          port: 80
          weight: 1
