apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratlab-demo
  namespace: ratlab-demo
  labels:
    app: ratlab-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ratlab-demo
  template:
    metadata:
      labels:
        app: ratlab-demo
    spec:
      serviceAccountName: ratlab-demo
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ratlab-demo
          image: ghcr.io/wasim-hassan/ratlab-demo:0.1.4 # {"$imagepolicy": "flux-system:ratlab-demo"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
