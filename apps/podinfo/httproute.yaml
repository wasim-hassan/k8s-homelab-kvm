apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - "podinfo.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: podinfo
          namespace: podinfo
          port: 80
          weight: 1
