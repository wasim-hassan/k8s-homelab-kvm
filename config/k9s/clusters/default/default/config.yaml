k9s:
  cluster: default
  readOnly: false
  namespace:
    active: all
    lockFavorites: false
    favorites:
      - envoy-gateway-system
      - podinfo
      - kube-public
      - default
      - all
      - kube-system
      - monitoring
  view:
    active: v1/namespaces
  featureGates:
    nodeShell: false
  proxy: null
